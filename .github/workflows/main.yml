name: GNU Crawler

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 실행
  workflow_dispatch:        # 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # git push를 위한 쓰기 권한 부여

    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # v3 -> v4 업데이트 (Node 20 경고 해결)

      - name: Set up Python
        uses: actions/setup-python@v5  # v4 -> v5 업데이트 (Node 20 경고 해결)
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-telegram-bot

      - name: Run crawler
        run: python crawler.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_id.txt
          git diff --staged --quiet || (git commit -m "Update last_id.txt" && git push)
