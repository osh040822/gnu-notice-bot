name: GNU Crawler

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 실행
  workflow_dispatch:        # 수동으로도 실행 가능하게 함

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-telegram-bot

      - name: Run crawler
        run: python crawler.py
        env:
          # 여기서 봇 토큰과 채팅 ID를 환경 변수로 넘겨줄 수 있습니다.
          # 하지만 간단하게 하려면 그냥 코드에 넣은 그대로 두셔도 됩니다.
          
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_id.txt
          git commit -m "Update last_id.txt" || exit 0
          git push
